version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      # TypeScript 7 requires a deliberate migration away from the stable compiler API.
      - dependency-name: typescript
        versions:
          - '7.x'
    groups:
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      workflow-dependencies:
        patterns:
          - '*'
